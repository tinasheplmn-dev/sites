      <path d="M12 6.5v13.6"/>
    </symbol>
    <!-- tas: afhaaltas -->
    <symbol id="i-tas" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
