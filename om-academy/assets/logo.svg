      <stop offset="0" stop-color="#4d8bff"/>
      <stop offset="1" stop-color="#1a3fd6"/>
    </linearGradient>
    <radialGradient id="bal" cx=".4" cy=".35" r=".7">
      <stop offset="0" stop-color="#ffb26b"/>
