<!doctype html><meta charset="utf-8"><body style="margin:0;background:#888">
<iframe id="f" style="width:375px;height:9600px;border:0;display:block"></iframe>
<script>
const p = new URLSearchParams(location.search).get('p') || 'index.html';
const f = document.getElementById('f');
f.addEventListener('load', () => {
  try {
    const d = f.contentDocument;
    const o = d.getElementById('opening');
    console.log('WRAP load, opening aanwezig:', !!o);
    if (o) o.remove();
    d.body.classList.add('onthullen');
    console.log('WRAP klaar, bodyclass:', d.body.className);
  } catch (e) { console.log('WRAP fout', String(e)); }
});
f.src = '/' + p;
</script>
